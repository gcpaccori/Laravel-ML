version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sismapiscis_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - laravel
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: sismapiscis_mysql
    restart: always
    environment:
      MYSQL_DATABASE: sismapiscis
      MYSQL_USER: sismapiscis_user
      MYSQL_PASSWORD: 1q7ML9aG03
      MYSQL_ROOT_PASSWORD: sismapiscis2025
    ports:
      - "3306:3306" # acceso externo
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: sismapiscis_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
