version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sismapiscis_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - laravel
    depends_on:
      - db

  # ← NUEVO: Servicio separado para Reverb
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sismapiscis_reverb
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    ports:
      - "8080:8080"  # ← Puerto para WebSockets
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    networks:
      - laravel
    depends_on:
      - db
      - app

  # ← NUEVO: Worker para colas (si usas ShouldBroadcast)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sismapiscis_worker
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --tries=3
    networks:
      - laravel
    depends_on:
      - db
      - app

  db:
    image: mysql:8
    container_name: sismapiscis_mysql
    restart: always
    environment:
      MYSQL_DATABASE: sismapiscis
      MYSQL_USER: sismapiscis_user
      MYSQL_PASSWORD: 1q7ML9aG03
      MYSQL_ROOT_PASSWORD: sismapiscis2025
    ports:
      - "3306:3306" # acceso externo
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: sismapiscis_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
